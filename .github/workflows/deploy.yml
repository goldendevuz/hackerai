name: Deploy to production

# Solider.uz change: builds the web app image on GitHub's runners (the
# production host's 2 CPUs would be too tight to build Next.js itself) and
# pushes it to GHCR. The server then just pulls the new image and restarts
# the container; it never compiles anything. Convex, Trigger.dev tasks and
# the Agent's E2B sandboxes are separate cloud services this workflow never
# touches.
#
# 2026-11-05: production moved off the Hetzner VPS to a teammate's always-on
# machine, reachable only over Tailscale (not a public IP) -- DEPLOY_HOST is
# that machine's Tailscale IP, DEPLOY_PORT its non-standard SSH port, and the
# deploy user is a non-root account (in the `docker` group) rather than root.

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.sha_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compute image tag
        id: meta
        run: echo "sha_tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349 # v4.0.0

      - name: Log in to GHCR
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.sha_tag }}
          build-args: |
            NEXT_PUBLIC_CONVEX_URL=${{ secrets.NEXT_PUBLIC_CONVEX_URL }}
            NEXT_PUBLIC_CONVEX_SITE_URL=${{ secrets.NEXT_PUBLIC_CONVEX_SITE_URL }}
            NEXT_PUBLIC_WORKOS_REDIRECT_URI=${{ secrets.NEXT_PUBLIC_WORKOS_REDIRECT_URI }}
            NEXT_PUBLIC_BASE_URL=${{ secrets.NEXT_PUBLIC_BASE_URL }}
            NEXT_PUBLIC_SOLIDER_UNLOCK_CLOUD_AGENT=${{ secrets.NEXT_PUBLIC_SOLIDER_UNLOCK_CLOUD_AGENT }}
            NEXT_PUBLIC_SOLIDER_UNLOCK_MODEL_TIERS=${{ secrets.NEXT_PUBLIC_SOLIDER_UNLOCK_MODEL_TIERS }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # DEPLOY_HOST is a Tailscale IP, not a public one -- the runner must
      # join the tailnet before it can reach it. TAILSCALE_OAUTH_CLIENT_ID/
      # SECRET come from an OAuth client scoped to tag:ci (Tailscale admin
      # console -> Settings -> OAuth clients). Each run authenticates with
      # short-lived OAuth credentials and tags itself tag:ci rather than
      # using a long-lived auth key.
      - name: Join tailnet
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8 # v4.1.2
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
          tags: tag:ci

      - name: Copy compose file to server
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: 8022
          username: ikazimov7
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "docker-compose.yml"
          target: "/home/ikazimov7/projects/hackerai"

      - name: Pull and restart on server
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: 8022
          username: ikazimov7
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /home/ikazimov7/projects/hackerai
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            docker compose --profile full --profile tunnel pull web
            docker compose --profile full --profile tunnel up -d --remove-orphans
            docker image prune -f
