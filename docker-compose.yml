name: hackerai

# Lokal: odatda kerak emas (pnpm dev / Vercel preview ishlatiladi).
# Server: .env'da COMPOSE_PROFILES=full,tunnel -> `docker compose up -d --build`
#
# Convex, Trigger.dev task'lari va Agent'ning E2B sandboxlari o'z bulutida
# ishlaydi -- bu compose faqat Next.js ilovasining o'zini serverda ishga
# tushiradi, hech qanday ma'lumotlar bazasi yoki worker shart emas.
services:
  web:
    # CI (.github/workflows/deploy.yml) builds this on GitHub's runners and
    # pushes it to GHCR. `docker compose pull && up -d` on the server just
    # swaps the container; `docker compose build` still works locally if
    # you want to build it yourself instead.
    image: ghcr.io/goldendevuz/hackerai:latest
    build:
      context: .
      args:
        NEXT_PUBLIC_CONVEX_URL: ${NEXT_PUBLIC_CONVEX_URL:-}
        NEXT_PUBLIC_CONVEX_SITE_URL: ${NEXT_PUBLIC_CONVEX_SITE_URL:-}
        NEXT_PUBLIC_WORKOS_REDIRECT_URI: ${NEXT_PUBLIC_WORKOS_REDIRECT_URI:-}
    env_file: .env
    # Faqat localhost'da -- tashqariga Cloudflare tunnel orqali chiqadi
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    # Production host is itself a Tailscale node: its default DNS resolver
    # (MagicDNS) resolves redis-http's own Funnel hostname
    # (UPSTASH_REDIS_REST_URL, see below) to the *internal* tailnet IP,
    # which this container's bridge network can't route to -- "fetch
    # failed" on every rate-limit check even though the Funnel URL is
    # genuinely public. Pinning public resolvers here bypasses MagicDNS and
    # resolves the real public Funnel IP instead. Don't remove this even if
    # it looks redundant -- see [[project-production-host-ikazimov7]].
    dns:
      - 1.1.1.1
      - 8.8.8.8
    mem_limit: 4096m
    mem_reservation: 1024m
    restart: unless-stopped
    profiles: ["full"]

  # Rate-limiting backend. lib/rate-limit/redis.ts and the Trigger.dev tasks
  # (trigger/agent-long.ts, trigger/subagent.ts) both expect an Upstash-style
  # REST Redis (UPSTASH_REDIS_REST_URL/TOKEN) so one user can't burn through
  # the shared OpenRouter budget. Upstash's own serverless-redis-http (SRH)
  # puts that REST API in front of a plain self-hosted Redis -- free, no
  # external account needed. SRH must be reachable from Trigger.dev's own
  # cloud workers (not just this server). The production host has no public
  # inbound IP (home network, Tailscale-only), so redis-http is bound to
  # loopback only and made public instead via `tailscale funnel --bg 8079`
  # run once on the host -- that's what actually exposes it, not a host
  # port here. UPSTASH_REDIS_REST_URL points at that Funnel hostname.
  redis:
    image: redis:8.8-alpine
    command: redis-server --save 60 1 --appendonly yes
    volumes:
      - redis-data:/data
    restart: unless-stopped
    profiles: ["full"]

  redis-http:
    image: hiett/serverless-redis-http:0.0.10
    environment:
      SRH_MODE: env
      SRH_TOKEN: ${SRH_TOKEN:-}
      SRH_CONNECTION_STRING: redis://redis:6379
    ports:
      - "127.0.0.1:${REDIS_HTTP_PORT:-8079}:80"
    depends_on:
      - redis
    restart: unless-stopped
    profiles: ["full"]

  # Cloudflare Tunnel: <domen> -> web:3000. Token: Zero Trust -> Networks -> Tunnels.
  # Public hostname dashboard'da http://web:3000 ga yo'naltiriladi.
  cloudflared:
    image: cloudflare/cloudflared:2026.10.3
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - web
    restart: unless-stopped
    profiles: ["tunnel"]

volumes:
  redis-data:
